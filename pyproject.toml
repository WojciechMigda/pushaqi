[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pushaqi"
version = "0.2.0"
description = "Kraków air-quality bot — scrapes Airly widget readings and posts US AQI alerts to Mastodon"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["aqi", "air-quality", "mastodon", "krakow", "airly"]
dependencies = [
    "lxml>=4.9",
    "plac>=1.3",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
pushaqi = "pusher:cli"

[tool.setuptools]
py-modules = ["pusher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"